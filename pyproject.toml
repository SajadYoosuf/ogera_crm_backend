[project]
name = "ogera-crm-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sajad yoosuf", email = "sajadyoosuf.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.1",
]

[tool.uv]
# Flat layout app (main.py at the root), not an installable package.
# Skip building/installing the project itself; only sync its dependencies.
package = false

[tool.setuptools]
# Vercel passes --no-editable which invokes setuptools; explicitly declare no packages
# to prevent flat-layout auto-discovery failure on models/routes/schemas/services dirs.
packages = []
